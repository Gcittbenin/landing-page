<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- An admin area has no business in a search index. -->
<meta name="robots" content="noindex, nofollow">
<title>Connexion — Espace GCITT</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background: linear-gradient(160deg, #12305c 0%, #0d2447 100%);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    color: #1c2430;
  }
  .card {
    width: 100%; max-width: 380px; background: #fff; border-radius: 16px;
    padding: 34px 30px; box-shadow: 0 24px 60px rgba(0, 0, 0, .28);
  }
  .brand { font-size: 12px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; color: #d21f2d; }
  h1 { font-size: 22px; margin: 10px 0 6px; color: #12305c; }
  .sub { font-size: 13.5px; color: #5b6472; margin: 0 0 24px; line-height: 1.55; }
  label { display: block; font-size: 12.5px; font-weight: 700; color: #334055; margin-bottom: 6px; }
  input {
    width: 100%; padding: 12px 13px; margin-bottom: 16px; font-size: 15px; font-family: inherit;
    border: 1.5px solid #d9dee7; border-radius: 9px; background: #fff; color: inherit;
  }
  input:focus { outline: none; border-color: #12305c; box-shadow: 0 0 0 3px rgba(18, 48, 92, .12); }
  button {
    width: 100%; padding: 13px; font-size: 15px; font-weight: 700; font-family: inherit;
    color: #fff; background: #12305c; border: 0; border-radius: 9px; cursor: pointer;
  }
  button:hover { background: #0d2447; }
  button[disabled] { background: #8792a3; cursor: progress; }
  .error {
    display: none; margin: 0 0 16px; padding: 11px 13px; border-radius: 9px;
    background: #fdecee; border-left: 3px solid #d21f2d; color: #8c1420; font-size: 13.5px;
  }
  .error.on { display: block; }
  .foot { margin-top: 22px; font-size: 12px; color: #8792a3; text-align: center; line-height: 1.6; }
</style>
</head>
<body>
  <main class="card">
    <div class="brand">GCITT BENIN SA</div>
    <h1>Espace prospects</h1>
    <p class="sub">Accès réservé à l'équipe commerciale.</p>

    <p class="error" id="error" role="alert"></p>

    <form id="form" autocomplete="on">
      <label for="username">Identifiant</label>
      <input id="username" name="username" autocomplete="username" required autofocus>

      <label for="password">Mot de passe</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>

      <button type="submit" id="submit">Se connecter</button>
    </form>

    <p class="foot">Les données affichées ici sont personnelles.<br>Ne les partagez pas en dehors de GCITT.</p>
  </main>

<script>
(function () {
  var form = document.getElementById('form');
  var button = document.getElementById('submit');
  var error = document.getElementById('error');

  function fail(message) {
    error.textContent = message;
    error.className = 'error on';
    button.disabled = false;
    button.textContent = 'Se connecter';
  }

  form.addEventListener('submit', function (event) {
    event.preventDefault();
    error.className = 'error';
    button.disabled = true;
    button.textContent = 'Connexion…';

    fetch('/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value
      })
    }).then(function (response) {
      return response.json().then(function (data) { return { ok: response.ok, data: data }; });
    }).then(function (result) {
      if (result.ok && result.data.ok) {
        window.location.href = '/admin';
        return;
      }
      fail(result.data.error || 'Connexion impossible.');
    }).catch(function () {
      fail('Serveur injoignable. Vérifiez votre connexion.');
    });
  });
})();
</script>
</body>
</html>
